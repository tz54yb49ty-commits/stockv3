[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-v3"
version = "0.1.0"
description = "A-share monitor v3 raw ingestion layer"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "psycopg[binary]>=3.1",
  "tushare>=1.4",
  "mootdx>=0.11",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
