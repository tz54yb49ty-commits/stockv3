<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N6 登录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --ink: #172124;
      --muted: #607176;
      --line: #d7e0e3;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 720;
    }
    .subtle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
    }
    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }
    button {
      min-height: 42px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 720;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .error {
      min-height: 20px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 680;
    }
  </style>
</head>
<body>
  <main>
    <h1>N6 用户投影</h1>
    <p class="subtle">A股监控系统 v3</p>
    <form id="login-form" autocomplete="on">
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        账号
        <input name="login_name" autocomplete="username" required>
      </label>
      <label>
        密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">登录</button>
      <div class="error" id="login-error" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const error = document.getElementById("login-error");
    const nextTarget = {{ next|tojson }};
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const data = Object.fromEntries(new FormData(form).entries());
      const response = await fetch("/api/n6/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      if (response.ok) {
        const redirectUrl = new URL(response.url, window.location.origin);
        const redirectPath = redirectUrl.origin === window.location.origin
          ? `${redirectUrl.pathname}${redirectUrl.search}${redirectUrl.hash}`
          : "/n6/app";
        const redirectTarget = nextTarget || redirectPath || "/n6/app";
        window.location.assign(redirectTarget);
        return;
      }
      error.textContent = "登录失败";
    });
  </script>
</body>
</html>
