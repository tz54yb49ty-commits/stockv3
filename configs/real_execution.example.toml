[real_execution]
# N3.1 is still template-only. Keep real execution disabled.
mode = "preflight_only"
approved_stage = "none"
allow_real_execution = false
operator_confirmation_id = ""

[configs]
initial_backfill_config = "configs/initial_backfill.example.toml"
daily_incremental_config = "configs/daily_incremental.example.toml"

[paths]
data_root = "/Volumes/MacRaid/database"
tdx_root = "/Volumes/MacRaid/tdxdata/tdx"

[security]
# Secrets must be read from environment variables or a local secret manager.
# Do not put a real Tushare token or PostgreSQL DSN in this file.
tushare_token_env = "TUSHARE_TOKEN"
postgres_dsn_env = "ASHARE_V3_POSTGRES_DSN"
store_secret_in_config = false

[permissions]
# N3.1 is configuration-template validation only. Keep every switch false.
allow_network = false
allow_tdx_file_read = false
allow_database_write = false
allow_data_file_write = false
allow_worker_start = false
allow_old_system_access = false

[quality_gate]
block_on_p0 = true
require_identity_key_coverage = true
require_physical_table_split = true
require_official_daily_proof = true
require_stock_daily_basic_universe = true
require_active_source_version_rollback = true

[rollback]
strategy = "delete_by_source_batch_id_then_restore_previous_active_source_version"
require_source_batch_id_delete = true
require_previous_active_source_version_restore = true
require_manifest_rollback_plan = true
require_failed_audit_retention = true

[preflight]
required_confirmation_items = [
  "scope.raw_ingestion_only",
  "stage.one_stage_at_a_time",
  "secret.tushare_token_env",
  "secret.postgres_dsn_env",
  "source.tushare_network",
  "source.mootdx_network",
  "source.tdx_local_txt_read",
  "database.postgresql_schema_and_write",
  "archive.data_root_write",
  "quality_gate.activation_blocking",
  "rollback.source_batch_restore",
  "safety.old_system_boundary",
  "safety.no_worker_or_service_start",
]
